buildscript {
    ext.kotlin_version = "1.7.10"
    repositories {
        google()
        mavenCentral()
        maven { url=uri('https://maven.aliyun.com/nexus/content/groups/public/') }
        maven { url=uri('https://maven.aliyun.com/repository/google') }
        maven { url=uri('https://maven.aliyun.com/repository/gradle-plugin') }
        maven { url=uri('https://maven.aliyun.com/repository/jcenter') }
        maven { url=uri('https://maven.aliyun.com/repository/central') }
        maven { url=uri('https://maven.aliyun.com/repository/public') }
        maven { url=uri('https://download.flutter.io') }
        maven { url=uri('https://storage.flutter-io.cn/download.flutter.io') }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.5.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url=uri('https://maven.aliyun.com/nexus/content/groups/public/') }
        maven { url=uri('https://maven.aliyun.com/repository/google') }
        maven { url=uri('https://maven.aliyun.com/repository/gradle-plugin') }
        maven { url=uri('https://maven.aliyun.com/repository/jcenter') }
        maven { url=uri('https://maven.aliyun.com/repository/central') }
        maven { url=uri('https://maven.aliyun.com/repository/public') }
        maven { url=uri('https://download.flutter.io') }
        maven { url=uri('https://storage.flutter-io.cn/download.flutter.io') }
    }
}

def flutterSdkPath = {
    def properties = new Properties()
    file("local.properties").withInputStream { properties.load(it) }
    def flutterSdkPath = properties.getProperty("flutter.sdk")
    assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
    return flutterSdkPath
}()

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.befovy.fijkplayer"
    compileSdk 34

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        encoding = "UTF-8"
    }
    lintOptions {
        disable 'InvalidPackage'
        disable 'GradleDependency'
    }

    tasks.register("flutterSdkPath") {
        doLast {
            println "flutterSdkPath => " + flutterSdkPath + "\n"
        }
    }

    // 解决导入AS后出现错误乱码
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.fork = true
            options.forkOptions.jvmArgs += ["-Duser.language=en"]
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

dependencies {
    // implementation(name: 'fijkplayer-full-release', ext: 'aar')

    // fijkplayer-full include the java lib and native shared libs for armv5 armv7 arm64 x86 x86_64
    implementation 'com.befovy.fijkplayer:fijkplayer-full:0.7.16'
    implementation 'androidx.annotation:annotation:1.8.0'

    //  implementation files(flutterSdkPath + '/bin/cache/artifacts/engine/android-x64/flutter.jar')
}
